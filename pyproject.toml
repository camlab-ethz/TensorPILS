[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpils"
dynamic = ["version"]
description = "Preconditioned physics-informed training of neural operators with finite-element losses"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shizheng Wen", email = "shizheng.wen@math.ethz.ch"},
    {name = "Marius Zeinhofer", email = "marius.zeinhofer@math.ethz.ch"},
    {name = "Siddhartha Mishra", email = "siddhartha.mishra@math.ethz.ch"},
]
maintainers = [
    {name = "Shizheng Wen", email = "shizheng.wen@math.ethz.ch"},
]
keywords = [
    "neural-operator",
    "physics-informed",
    "preconditioning",
    "multigrid",
    "finite-element-methods",
    "partial-differential-equation",
    "pytorch",
    "ai-for-science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# torch-amgx (the algebraic multigrid of the Stokes preconditioner) is not on PyPI; see README.md.
dependencies = [
    "tensormesh-fem>=0.2.1",    # finite-element assembly; import name `tensormesh`
    "neuraloperator>=2.0",      # the FNO and PINO's finite differences; import name `neuralop`
    "torch>=2.0",
    "numpy",
    "scipy",
    "meshio",
    "gmsh",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tensorpils = "tensorpils.cli:main"

[project.urls]
Repository = "https://github.com/camlab-ethz/TensorPILS"
Issues = "https://github.com/camlab-ethz/TensorPILS/issues"

[tool.setuptools.dynamic]
version = {attr = "tensorpils._version.__version__"}

[tool.setuptools.packages.find]
include = ["tensorpils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
